<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title -->
    <title>Digital Market Place HTML Template</title>
    <!-- Favicon -->
    <link rel="shortcut icon" href="/assets/images/logo/favicon-two.png">

    <!-- Bootstrap CSS - kept for global utility classes -->
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <!-- Fontawesome CSS - kept for global icons -->
    <link rel="stylesheet" href="/assets/css/fontawesome-all.min.css">
    <!-- Line Awesome CSS - kept for global icons -->
    <link rel="stylesheet" href="/assets/css/line-awesome.min.css">

    <!--
    Note: Other CSS files from the original project (slick.css, magnific-popup.css, main.css)
    are not included here. In a React + Vite project, these styles should ideally be
    imported directly into their respective React components or the main application CSS,
    allowing Vite to handle bundling and optimization.
    -->
</head>
<body>
    <!--
    The entire body content of the original HTML (preloader, overlays, mobile menu,
    all content sections like banner, products, blog, footer, etc.) is removed.
    In a React application, this content will be dynamically rendered by React components
    mounted into the root div.
    -->
    <div id="root"></div>

    <!--
    Vite's entry point for the React application.
    The original JavaScript files (jQuery, Bootstrap bundle, countdown, counterup, slick,
    magnific-popup, apexchart, marquee, and main.js) are removed. Their functionalities
    will be replaced by React component logic, state management, and React-compatible
    libraries/hooks.
    -->
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
